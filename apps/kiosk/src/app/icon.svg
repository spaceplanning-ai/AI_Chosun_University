<!--
  탭 아이콘.

  화면 왼쪽 위 로고와 같은 모양이다 — 프리즘 그라디언트 사각형 안에 흰 점.
  값을 CSS 토큰에서 읽어 올 수 없는 자리라 색을 직접 적되,
  `tokens.semantic.css` 의 --gradient-prism 과 같은 네 정거장을 그대로 쓴다.

  파일이 없으면 브라우저가 /favicon.ico 를 찾다가 404 를 남긴다.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="AI 남도 프리즘">
  <defs>
    <linearGradient id="prism" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e93a3" />
      <stop offset="38%" stop-color="#4fa8d8" />
      <stop offset="72%" stop-color="#1e9e6e" />
      <stop offset="100%" stop-color="#f2a20c" />
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="8" fill="url(#prism)" />
  <circle cx="16" cy="16" r="6" fill="#ffffff" />
</svg>
