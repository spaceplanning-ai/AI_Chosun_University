<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 833" width="680" height="833" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5c6b85"/></marker>
<marker id="arrow-reject" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#93380a"/></marker>
</defs>
<rect width="680" height="833" fill="#ffffff"/>
<text x="28" y="34" font-size="17" font-weight="700" fill="#16202e">도면 4. 초광역 관광연계지수 산출과정</text>
<text x="28" y="54" font-size="12" fill="#5c6b85">두 지역이 섞였다는 사실이 아니라 &quot;어떻게 섞였는가&quot;를 네 구성요소로 분해해 계산한다.</text>
<line x1="178" y1="128" x2="178" y2="160" stroke="#5c6b85" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="178" y1="239" x2="178" y2="271" stroke="#5c6b85" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="178" y1="350" x2="178" y2="382" stroke="#5c6b85" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="178" y1="461" x2="178" y2="493" stroke="#5c6b85" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="178" y1="572" x2="178" y2="604" stroke="#5c6b85" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="178" y1="683" x2="178" y2="715" stroke="#5c6b85" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="328" y1="644.5" x2="400" y2="644.5" stroke="#93380a" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-reject)"/><text x="365" y="636.5" text-anchor="middle" font-size="11" fill="#93380a">단일 지역</text><rect x="402" y="606" width="250" height="77" rx="8" fill="#e1f0fa" stroke="#2e7fc2" stroke-width="1.5"/><text x="527" y="632" text-anchor="middle" font-size="15" font-weight="600" fill="#16202e">연계 보정 검토</text><text x="527" y="653" text-anchor="middle" font-size="12" fill="#16202e" opacity="0.7">연계지수가 실제로 상승할 때만</text><text x="527" y="670" text-anchor="middle" font-size="12" fill="#16202e" opacity="0.7">마지막 방문지를 교체</text><rect x="28" y="68" width="300" height="60" rx="22" fill="#0f2038" stroke="#245894" stroke-width="1.5"/><text x="178" y="94" text-anchor="middle" font-size="15" font-weight="600" fill="#ebeff5">방문 순서가 유지된 관광지 목록</text><text x="178" y="115" text-anchor="middle" font-size="12" fill="#ebeff5" opacity="0.7">순서가 이동 효율·연속성 계산에 쓰인다</text><rect x="28" y="162" width="300" height="77" rx="8" fill="#ffffff" stroke="#33415a" stroke-width="1.5"/><text x="178" y="188" text-anchor="middle" font-size="15" font-weight="600" fill="#16202e">지역 균형 (가중치 35)</text><text x="178" y="209" text-anchor="middle" font-size="12" fill="#16202e" opacity="0.7">2 × min(광주 수, 전남 수) ÷</text><text x="178" y="226" text-anchor="middle" font-size="12" fill="#16202e" opacity="0.7">전체 수 × 100</text><rect x="28" y="273" width="300" height="77" rx="8" fill="#ffffff" stroke="#33415a" stroke-width="1.5"/><text x="178" y="299" text-anchor="middle" font-size="15" font-weight="600" fill="#16202e">자원 상보성 (가중치 25)</text><text x="178" y="320" text-anchor="middle" font-size="12" fill="#16202e" opacity="0.7">(1 − 두 지역 관광유형 교집합 ÷</text><text x="178" y="337" text-anchor="middle" font-size="12" fill="#16202e" opacity="0.7">합집합) × 100</text><rect x="28" y="384" width="300" height="77" rx="8" fill="#ffffff" stroke="#33415a" stroke-width="1.5"/><text x="178" y="410" text-anchor="middle" font-size="15" font-weight="600" fill="#16202e">이동 효율 (가중치 25)</text><text x="178" y="431" text-anchor="middle" font-size="12" fill="#16202e" opacity="0.7">최소 경계횡단 수 ÷ 실제 경계횡단 수</text><text x="178" y="448" text-anchor="middle" font-size="12" fill="#16202e" opacity="0.7">× 100</text><rect x="28" y="495" width="300" height="77" rx="8" fill="#ffffff" stroke="#33415a" stroke-width="1.5"/><text x="178" y="521" text-anchor="middle" font-size="15" font-weight="600" fill="#16202e">여정 연속성 (가중치 15)</text><text x="178" y="542" text-anchor="middle" font-size="12" fill="#16202e" opacity="0.7">인접·동일 시군으로 이어진 구간 수 ÷</text><text x="178" y="559" text-anchor="middle" font-size="12" fill="#16202e" opacity="0.7">전체 구간 수 × 100</text><rect x="28" y="606" width="300" height="77" rx="8" fill="#fef3da" stroke="#b26a05" stroke-width="1.5"/><text x="178" y="632" text-anchor="middle" font-size="15" font-weight="600" fill="#16202e">한 지역만으로 구성되었는가</text><text x="178" y="653" text-anchor="middle" font-size="12" fill="#16202e" opacity="0.7">단일 지역이면 균형·상보성·이동 효율이</text><text x="178" y="670" text-anchor="middle" font-size="12" fill="#16202e" opacity="0.7">모두 0</text><rect x="28" y="717" width="300" height="60" rx="8" fill="#e1f0fa" stroke="#2e7fc2" stroke-width="1.5"/><text x="178" y="743" text-anchor="middle" font-size="15" font-weight="600" fill="#16202e">연계지수 확정 (0–100)</text><text x="178" y="764" text-anchor="middle" font-size="12" fill="#16202e" opacity="0.7">구성요소별 값과 산출 근거를 함께 저장</text>
</svg>
