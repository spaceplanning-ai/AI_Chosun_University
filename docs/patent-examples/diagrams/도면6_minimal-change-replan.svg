<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 888" width="680" height="888" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5c6b85"/></marker>
<marker id="arrow-reject" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#93380a"/></marker>
</defs>
<rect width="680" height="888" fill="#ffffff"/>
<text x="28" y="34" font-size="17" font-weight="700" fill="#16202e">도면 6. 일정 변경 및 재구성과정</text>
<text x="28" y="54" font-size="12" fill="#5c6b85">추가 제약조건을 최소 변경으로 반영한다. 한 요청당 최대 2곳만 교체.</text>
<line x1="178" y1="128" x2="178" y2="160" stroke="#5c6b85" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="178" y1="239" x2="178" y2="271" stroke="#5c6b85" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="178" y1="350" x2="178" y2="382" stroke="#5c6b85" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="178" y1="478" x2="178" y2="510" stroke="#5c6b85" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="178" y1="610" x2="178" y2="642" stroke="#5c6b85" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="178" y1="721" x2="178" y2="753" stroke="#5c6b85" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="328" y1="561" x2="400" y2="561" stroke="#93380a" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-reject)"/><text x="365" y="553" text-anchor="middle" font-size="11" fill="#93380a">미충족</text><rect x="402" y="522.5" width="250" height="77" rx="8" fill="#fdeade" stroke="#93380a" stroke-width="1.5"/><text x="527" y="548.5" text-anchor="middle" font-size="15" font-weight="600" fill="#16202e">기각 사유 기록</text><text x="527" y="569.5" text-anchor="middle" font-size="12" fill="#16202e" opacity="0.7">개선 없음 · 성격 상이 ·</text><text x="527" y="586.5" text-anchor="middle" font-size="12" fill="#16202e" opacity="0.7">일정 성립 불가 · 차순위</text><line x1="328" y1="682.5" x2="400" y2="682.5" stroke="#93380a" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-reject)"/><text x="365" y="674.5" text-anchor="middle" font-size="11" fill="#93380a">미달성</text><rect x="402" y="644" width="250" height="77" rx="8" fill="#e1f0fa" stroke="#2e7fc2" stroke-width="1.5"/><text x="527" y="670" text-anchor="middle" font-size="15" font-weight="600" fill="#16202e">다음 영향도 순위로 반복</text><text x="527" y="691" text-anchor="middle" font-size="12" fill="#16202e" opacity="0.7">상한 2곳에 도달하면 미달성으로</text><text x="527" y="708" text-anchor="middle" font-size="12" fill="#16202e" opacity="0.7">종료</text><rect x="28" y="68" width="300" height="60" rx="22" fill="#0f2038" stroke="#245894" stroke-width="1.5"/><text x="178" y="94" text-anchor="middle" font-size="15" font-weight="600" fill="#ebeff5">추가 제약조건 입력</text><text x="178" y="115" text-anchor="middle" font-size="12" fill="#ebeff5" opacity="0.7">「걷는 시간을 줄여줘」 등 6종</text><rect x="28" y="162" width="300" height="77" rx="8" fill="#ffffff" stroke="#33415a" stroke-width="1.5"/><text x="178" y="188" text-anchor="middle" font-size="15" font-weight="600" fill="#16202e">조건벡터 변화량 적용</text><text x="178" y="209" text-anchor="middle" font-size="12" fill="#16202e" opacity="0.7">constraintChange.ts —</text><text x="178" y="226" text-anchor="middle" font-size="12" fill="#16202e" opacity="0.7">증감량은 선언적 데이터</text><rect x="28" y="273" width="300" height="77" rx="8" fill="#ffffff" stroke="#33415a" stroke-width="1.5"/><text x="178" y="299" text-anchor="middle" font-size="15" font-weight="600" fill="#16202e">방문지별 영향도 산정</text><text x="178" y="320" text-anchor="middle" font-size="12" fill="#16202e" opacity="0.7">impact.ts — 목표 지표 기여도</text><text x="178" y="337" text-anchor="middle" font-size="12" fill="#16202e" opacity="0.7">내림차순</text><rect x="28" y="384" width="300" height="94" rx="8" fill="#ffffff" stroke="#33415a" stroke-width="1.5"/><text x="178" y="410" text-anchor="middle" font-size="15" font-weight="600" fill="#16202e">대체 후보 탐색</text><text x="178" y="431" text-anchor="middle" font-size="12" fill="#16202e" opacity="0.7">replacementSearch.ts</text><text x="178" y="448" text-anchor="middle" font-size="12" fill="#16202e" opacity="0.7">— 교체본을 실제로 재계산해 개선폭</text><text x="178" y="465" text-anchor="middle" font-size="12" fill="#16202e" opacity="0.7">확정</text><rect x="28" y="512" width="300" height="98" rx="8" fill="#fef3da" stroke="#b26a05" stroke-width="1.5"/><text x="178" y="538" text-anchor="middle" font-size="15" font-weight="600" fill="#16202e">채택 조건 판정 (유사도 24점</text><text x="178" y="559" text-anchor="middle" font-size="15" font-weight="600" fill="#16202e">이상)</text><text x="178" y="580" text-anchor="middle" font-size="12" fill="#16202e" opacity="0.7">지표 개선 · 관광가치 유사 ·</text><text x="178" y="597" text-anchor="middle" font-size="12" fill="#16202e" opacity="0.7">운영시간과 활동시간 성립</text><rect x="28" y="644" width="300" height="77" rx="8" fill="#fef3da" stroke="#b26a05" stroke-width="1.5"/><text x="178" y="670" text-anchor="middle" font-size="15" font-weight="600" fill="#16202e">목표가 달성되었는가</text><text x="178" y="691" text-anchor="middle" font-size="12" fill="#16202e" opacity="0.7">달성 시 남은 영향도 순위를 보지 않고</text><text x="178" y="708" text-anchor="middle" font-size="12" fill="#16202e" opacity="0.7">즉시 중단</text><rect x="28" y="755" width="300" height="77" rx="8" fill="#e1f0fa" stroke="#2e7fc2" stroke-width="1.5"/><text x="178" y="781" text-anchor="middle" font-size="15" font-weight="600" fill="#16202e">변경 전/후 차이 산출</text><text x="178" y="802" text-anchor="middle" font-size="12" fill="#16202e" opacity="0.7">유지 장소 · 변경 장소 ·</text><text x="178" y="819" text-anchor="middle" font-size="12" fill="#16202e" opacity="0.7">변화량(%) · 지표별 증감</text>
</svg>
