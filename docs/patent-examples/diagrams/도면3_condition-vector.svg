<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 722" width="680" height="722" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5c6b85"/></marker>
<marker id="arrow-reject" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#93380a"/></marker>
</defs>
<rect width="680" height="722" fill="#ffffff"/>
<text x="28" y="34" font-size="17" font-weight="700" fill="#16202e">도면 3. 사용자 여행조건 처리과정</text>
<text x="28" y="54" font-size="12" fill="#5c6b85">선택형 입력을 연속값 벡터로 구조화. 이후 모든 점수 계산의 유일한 입력이 된다.</text>
<line x1="178" y1="145" x2="178" y2="177" stroke="#5c6b85" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="178" y1="256" x2="178" y2="288" stroke="#5c6b85" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="178" y1="367" x2="178" y2="399" stroke="#5c6b85" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="178" y1="478" x2="178" y2="510" stroke="#5c6b85" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="178" y1="572" x2="178" y2="604" stroke="#5c6b85" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="328" y1="542" x2="400" y2="542" stroke="#93380a" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-reject)"/><text x="365" y="534" text-anchor="middle" font-size="11" fill="#93380a">복수</text><rect x="402" y="503.5" width="250" height="77" rx="8" fill="#e1f0fa" stroke="#2e7fc2" stroke-width="1.5"/><text x="527" y="529.5" text-anchor="middle" font-size="15" font-weight="600" fill="#16202e">조건벡터 병합</text><text x="527" y="550.5" text-anchor="middle" font-size="12" fill="#16202e" opacity="0.7">취향은 합산 정규화 · 제약은</text><text x="527" y="567.5" text-anchor="middle" font-size="12" fill="#16202e" opacity="0.7">가장 제약이 큰 참여자 기준</text><rect x="28" y="68" width="300" height="77" rx="22" fill="#0f2038" stroke="#245894" stroke-width="1.5"/><text x="178" y="94" text-anchor="middle" font-size="15" font-weight="600" fill="#ebeff5">5단계 선택 입력</text><text x="178" y="115" text-anchor="middle" font-size="12" fill="#ebeff5" opacity="0.7">동행자 · 기간 · 관심분야 ·</text><text x="178" y="132" text-anchor="middle" font-size="12" fill="#ebeff5" opacity="0.7">이동수단 · 특별조건</text><rect x="28" y="179" width="300" height="77" rx="8" fill="#ffffff" stroke="#33415a" stroke-width="1.5"/><text x="178" y="205" text-anchor="middle" font-size="15" font-weight="600" fill="#16202e">관심유형 가중치 산출</text><text x="178" y="226" text-anchor="middle" font-size="12" fill="#16202e" opacity="0.7">명시 선택 + 동행유형 사전분포, 합계</text><text x="178" y="243" text-anchor="middle" font-size="12" fill="#16202e" opacity="0.7">1.0으로 정규화</text><rect x="28" y="290" width="300" height="77" rx="8" fill="#ffffff" stroke="#33415a" stroke-width="1.5"/><text x="178" y="316" text-anchor="middle" font-size="15" font-weight="600" fill="#16202e">제약 축 산출</text><text x="178" y="337" text-anchor="middle" font-size="12" fill="#16202e" opacity="0.7">보행 감내 한계 · 하루 활동시간 ·</text><text x="178" y="354" text-anchor="middle" font-size="12" fill="#16202e" opacity="0.7">이동거리 축소 요구</text><rect x="28" y="401" width="300" height="77" rx="8" fill="#ffffff" stroke="#33415a" stroke-width="1.5"/><text x="178" y="427" text-anchor="middle" font-size="15" font-weight="600" fill="#16202e">배려 축 산출</text><text x="178" y="448" text-anchor="middle" font-size="12" fill="#16202e" opacity="0.7">고령자·아동 배려 필요도 · 비용</text><text x="178" y="465" text-anchor="middle" font-size="12" fill="#16202e" opacity="0.7">민감도 · 대중교통 의존도</text><rect x="28" y="512" width="300" height="60" rx="8" fill="#fef3da" stroke="#b26a05" stroke-width="1.5"/><text x="178" y="538" text-anchor="middle" font-size="15" font-weight="600" fill="#16202e">동행자별 입력이 복수인가</text><text x="178" y="559" text-anchor="middle" font-size="12" fill="#16202e" opacity="0.7">C단계 확장 — 다중 사용자 선호 입력</text><rect x="28" y="606" width="300" height="60" rx="8" fill="#e1f0fa" stroke="#2e7fc2" stroke-width="1.5"/><text x="178" y="632" text-anchor="middle" font-size="15" font-weight="600" fill="#16202e">조건벡터 확정</text><text x="178" y="653" text-anchor="middle" font-size="12" fill="#16202e" opacity="0.7">평가요소 10축 — 로그에 그대로 저장</text>
</svg>
