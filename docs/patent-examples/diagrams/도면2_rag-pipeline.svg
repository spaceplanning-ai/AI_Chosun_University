<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 816" width="680" height="816" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5c6b85"/></marker>
<marker id="arrow-reject" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#93380a"/></marker>
</defs>
<rect width="680" height="816" fill="#ffffff"/>
<text x="28" y="34" font-size="17" font-weight="700" fill="#16202e">도면 2. 관광정보 수집 및 검색 구축과정</text>
<text x="28" y="54" font-size="12" fill="#5c6b85">공식문서 색인 구성과 질의 처리. 파생 키워드가 문서 단위 지역 질의를 회수한다.</text>
<line x1="178" y1="128" x2="178" y2="160" stroke="#5c6b85" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="178" y1="239" x2="178" y2="271" stroke="#5c6b85" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="178" y1="350" x2="178" y2="382" stroke="#5c6b85" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="178" y1="461" x2="178" y2="493" stroke="#5c6b85" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="178" y1="555" x2="178" y2="587" stroke="#5c6b85" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="178" y1="666" x2="178" y2="698" stroke="#5c6b85" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="328" y1="627.5" x2="400" y2="627.5" stroke="#93380a" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-reject)"/><text x="365" y="619.5" text-anchor="middle" font-size="11" fill="#93380a">기준 미만</text><rect x="402" y="597.5" width="250" height="60" rx="8" fill="#fdeade" stroke="#93380a" stroke-width="1.5"/><text x="527" y="623.5" text-anchor="middle" font-size="15" font-weight="600" fill="#16202e">잡음으로 폐기</text><text x="527" y="644.5" text-anchor="middle" font-size="12" fill="#16202e" opacity="0.7">부분일치 과다 회수 방지</text><rect x="28" y="68" width="300" height="60" rx="22" fill="#0f2038" stroke="#245894" stroke-width="1.5"/><text x="178" y="94" text-anchor="middle" font-size="15" font-weight="600" fill="#ebeff5">공식 관광문서 수집</text><text x="178" y="115" text-anchor="middle" font-size="12" fill="#ebeff5" opacity="0.7">지자체·공공기관·관광기관·운영시설</text><rect x="28" y="162" width="300" height="77" rx="8" fill="#e1f0fa" stroke="#2e7fc2" stroke-width="1.5"/><text x="178" y="188" text-anchor="middle" font-size="15" font-weight="600" fill="#16202e">메타데이터 기재</text><text x="178" y="209" text-anchor="middle" font-size="12" fill="#16202e" opacity="0.7">출처기관 · 기관유형 · 최종 갱신일</text><text x="178" y="226" text-anchor="middle" font-size="12" fill="#16202e" opacity="0.7">· 확인 정보항목</text><rect x="28" y="273" width="300" height="77" rx="8" fill="#ffffff" stroke="#33415a" stroke-width="1.5"/><text x="178" y="299" text-anchor="middle" font-size="15" font-weight="600" fill="#16202e">파생 키워드 결합</text><text x="178" y="320" text-anchor="middle" font-size="12" fill="#16202e" opacity="0.7">대상 관광지의 이름·소재지·지역명을</text><text x="178" y="337" text-anchor="middle" font-size="12" fill="#16202e" opacity="0.7">색인에 추가</text><rect x="28" y="384" width="300" height="77" rx="8" fill="#e1f0fa" stroke="#2e7fc2" stroke-width="1.5"/><text x="178" y="410" text-anchor="middle" font-size="15" font-weight="600" fill="#16202e">검색 색인 구성</text><text x="178" y="431" text-anchor="middle" font-size="12" fill="#16202e" opacity="0.7">앱 시작 시 원본에서 재생성 — 별도</text><text x="178" y="448" text-anchor="middle" font-size="12" fill="#16202e" opacity="0.7">갱신 명령 불필요</text><rect x="28" y="495" width="300" height="60" rx="8" fill="#ffffff" stroke="#33415a" stroke-width="1.5"/><text x="178" y="521" text-anchor="middle" font-size="15" font-weight="600" fill="#16202e">질의 생성 및 정규화</text><text x="178" y="542" text-anchor="middle" font-size="12" fill="#16202e" opacity="0.7">조사·의문형 어미 제거 후 검색어 추출</text><rect x="28" y="589" width="300" height="77" rx="8" fill="#fef3da" stroke="#b26a05" stroke-width="1.5"/><text x="178" y="615" text-anchor="middle" font-size="15" font-weight="600" fill="#16202e">어휘 일치 강도 판정</text><text x="178" y="636" text-anchor="middle" font-size="12" fill="#16202e" opacity="0.7">길이 비율 기반 — 짧고 일반적인</text><text x="178" y="653" text-anchor="middle" font-size="12" fill="#16202e" opacity="0.7">키워드는 약한 신호</text><rect x="28" y="700" width="300" height="60" rx="8" fill="#e1f0fa" stroke="#2e7fc2" stroke-width="1.5"/><text x="178" y="726" text-anchor="middle" font-size="15" font-weight="600" fill="#16202e">문서별 검색점수 산출</text><text x="178" y="747" text-anchor="middle" font-size="12" fill="#16202e" opacity="0.7">0–1 유사도 · 일치 검색어 목록</text>
</svg>
